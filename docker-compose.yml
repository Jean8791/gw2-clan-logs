# Site completo: a API (com o Elite Insights) atrás do Caddy, que cuida do HTTPS.
# Uso: copie .env.example para .env, preencha e rode `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?defina ADMIN_KEY no .env}
      # login com o Discord: o retorno é https://DOMINIO/api/auth/callback (cadastre no portal de desenvolvedores do Discord)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?defina DISCORD_CLIENT_ID no .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?defina DISCORD_CLIENT_SECRET no .env}
      # IDs dos servidores do Discord do clã, separados por vírgula. Preencha esta lista e/ou a de usuários: com as duas vazias o servidor
      # não sobe (qualquer conta do Discord entraria), a menos que ALLOW_ANY_DISCORD=true
      DISCORD_GUILD_IDS: ${DISCORD_GUILD_IDS:-}
      # IDs dos usuários do Discord com acesso, separados por vírgula; vale junto com a lista de servidores; vazia = não restringe
      DISCORD_USER_IDS: ${DISCORD_USER_IDS:-}
      # só com as duas listas vazias: true libera o login a qualquer conta do Discord, de propósito
      ALLOW_ANY_DISCORD: ${ALLOW_ANY_DISCORD:-}
      # opcional: dias de validade do token pessoal do script de envio (vazio = 90)
      API_TOKEN_DAYS: ${API_TOKEN_DAYS:-}
      PUBLIC_URL: https://${DOMINIO:?defina DOMINIO no .env}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # só o Caddy chega no app (a porta não é publicada), então o IP do X-Forwarded-For é confiável
      TRUST_PROXY: "true"
    # o Elite Insights usa até ~1,5 GB num log grande: sem teto, um envio ruim derruba a VM inteira.
    # Em VM de 1 GB, defina APP_MEM_LIMIT=800m no .env (logs grandes então falham com erro, sem derrubar o site).
    mem_limit: ${APP_MEM_LIMIT:-1500m}
    volumes:
      - dados:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data

volumes:
  dados:
  certificados:
