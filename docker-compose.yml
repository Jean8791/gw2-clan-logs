# Site completo: a API (com o Elite Insights) atrás do Caddy, que cuida do HTTPS.
# Uso: copie .env.example para .env, preencha e rode `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # quem administra o site (marcar guildas da aliança): IDs do Discord separados por vírgula, pelo login
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      # opcional, só para script: senha de administrador no cabeçalho x-upload-key. Sem ela e sem ADMIN_DISCORD_IDS a administração fica desligada
      ADMIN_KEY: ${ADMIN_KEY:-}
      # login com o Discord: o retorno é https://DOMINIO/api/auth/callback (cadastre no portal de desenvolvedores do Discord)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?defina DISCORD_CLIENT_ID no .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?defina DISCORD_CLIENT_SECRET no .env}
      # IDs dos servidores do Discord do clã, separados por vírgula. Preencha esta lista e/ou a de usuários: com as duas vazias o servidor
      # não sobe (qualquer conta do Discord entraria), a menos que ALLOW_ANY_DISCORD=true
      DISCORD_GUILD_IDS: ${DISCORD_GUILD_IDS:-}
      # IDs dos usuários do Discord com acesso, separados por vírgula; vale junto com a lista de servidores; vazia = não restringe
      DISCORD_USER_IDS: ${DISCORD_USER_IDS:-}
      # só com as duas listas vazias: true libera o login a qualquer conta do Discord, de propósito
      ALLOW_ANY_DISCORD: ${ALLOW_ANY_DISCORD:-}
      # opcional: pedidos por IP por minuto na API (vazio = 600; 0 desliga) e no login do Discord (vazio = 30)
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-}
      # opcional: dias de validade do token pessoal do script de envio (vazio = 90)
      API_TOKEN_DAYS: ${API_TOKEN_DAYS:-}
      # opcional: minutos que o Elite Insights tem para ler um log antes de ser cortado (vazio = 5)
      EI_TIMEOUT_MIN: ${EI_TIMEOUT_MIN:-}
      # opcional: true lê as posições dos jogadores no replay (% do tempo perto da tag); dobra a memória e o tempo do Elite Insights (vazio = não)
      EI_POSITIONS: ${EI_POSITIONS:-}
      DOTNET_GCHeapHardLimitPercent: ${DOTNET_GCHeapHardLimitPercent:-}
      PUBLIC_URL: https://${DOMINIO:?defina DOMINIO no .env}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # só o Caddy chega no app (a porta não é publicada), então o IP do X-Forwarded-For é confiável
      TRUST_PROXY: "true"
    # o Elite Insights usa ~1,3 GB de pico num log de 39 MB (medido; com 1500m o .NET falha, pois só usa 75% do limite): sem teto, um envio ruim derruba a VM inteira.
    # Em VM de 1 GB, defina APP_MEM_LIMIT=800m no .env (logs grandes então falham com erro, sem derrubar o site).
    mem_limit: ${APP_MEM_LIMIT:-2000m}
    # teto do heap do .NET em % do mem_limit, em HEXADECIMAL (5A = 90). Sem valor, o .NET usa 75% do limite do contêiner.
    # Em VM maior, suba o limite e este valor juntos (veja "Migrar para a VM Ampere A1" no README).
    # endurecimento: o app (e o Elite Insights, que processa arquivo de terceiros) roda sem root (usuário gw2logs, uid 10001, no Dockerfile),
    # sem capacidades do Linux, sem ganhar privilégios e sem escrever fora de /data e /tmp. O /tmp em memória conta no mem_limit: por isso é pequeno.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - dados:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
      # acesso ao painel de logs em https://DOMINIO/logs: usuário e hash bcrypt da senha (ver README)
      LOGS_USUARIO: ${LOGS_USUARIO:?defina LOGS_USUARIO no .env}
      LOGS_SENHA_HASH: ${LOGS_SENHA_HASH:?defina LOGS_SENHA_HASH no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data

  # Painel web dos logs dos containers. Só o Caddy chega nele (a porta não é publicada), e o Caddy exige senha.
  # O socket do Docker dá a ele acesso de leitura a TODOS os containers da VM: por isso o filtro limita ao projeto,
  # e por isso a senha do /logs precisa ser forte.
  dozzle:
    image: amir20/dozzle:v11.5.0
    restart: unless-stopped
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: name=gw2-clan-logs
      # o acesso já é protegido pelo Caddy: sem assistente de configuração, sem login próprio (precisaria do /data),
      # e sem ações nem shell nos containers (com o socket do Docker, seriam controle da VM)
      DOZZLE_DISABLE_SETUP_WIZARD: "true"
      DOZZLE_AUTH_PROVIDER: none
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_AUTO_UPDATE: "off"
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # o Dozzle grava aqui as preferências da tela; o resto do sistema de arquivos segue só de leitura
      - dozzle-dados:/data

volumes:
  dados:
  certificados:
  dozzle-dados:
